[project]
name = "copycat"
version = "0.1.0"
description = "RAG chatbot over YouTube fitness creators' transcripts"
readme = "README.md"
authors = [
    { name = "jpsilvadev", email = "jpsjoaosilva98@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
copycat = "copycat:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
